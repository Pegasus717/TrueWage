# docker compose up -d --build                      -> app on http://SERVER_IP:8080
# DOMAIN=truewage.example.com docker compose --profile https up -d --build   -> HTTPS on 443 via Caddy (auto certificates)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # optional; read from .env next to this file
      DATABASE_URL: ${DATABASE_URL:-}                 # Supabase / Postgres connection string; empty = local SQLite file in the volume
      TRUEWAGE_MODEL: ${TRUEWAGE_MODEL:-claude-haiku-5-5}
      TRUEWAGE_EXTRACT_MODEL: ${TRUEWAGE_EXTRACT_MODEL:-claude-haiku-5-5}
      TRUEWAGE_ESCALATE_MODEL: ${TRUEWAGE_ESCALATE_MODEL:-claude-sonnet-5-5}
      TRUEWAGE_AI_DAILY_IMAGES: ${TRUEWAGE_AI_DAILY_IMAGES:-400}
      TRUEWAGE_AI_USER_DAILY: ${TRUEWAGE_AI_USER_DAILY:-60}
      TRUEWAGE_AI_USER_ASKS: ${TRUEWAGE_AI_USER_ASKS:-100}
      TRUEWAGE_TRUST_PROXY: ${TRUEWAGE_TRUST_PROXY:-0}
      TRUEWAGE_COOKIE_SECURE: ${TRUEWAGE_COOKIE_SECURE:-0}
      TRUEWAGE_ADMIN_PHONES: ${TRUEWAGE_ADMIN_PHONES:-}
    volumes:
      - truewage-data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your domain name}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  truewage-data:
  caddy-data:
