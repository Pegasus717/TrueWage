<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>TrueWage – What a gig worker really earns</title>
<meta name="description" content="Upload earnings screenshots. TrueWage reads every order, subtracts petrol, repairs and data, and shows a gig worker's true hourly pay — with advice in their own language, an order checker, city-wide pay data for unions, and a verifiable income statement for banks.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230F766E'/%3E%3Cpath d='M6.5 21a9.5 9.5 0 0 1 19 0' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 21l4.6-6' stroke='%23FFB43A' stroke-width='2.8' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='2.2' fill='%23FFB43A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <a class="logo" href="#" id="logo" aria-label="TrueWage home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#0F766E"/><path d="M6.5 21a9.5 9.5 0 0 1 19 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M16 21l4.6-6" stroke="#FFB43A" stroke-width="2.8" stroke-linecap="round"/><circle cx="16" cy="21" r="2.2" fill="#FFB43A"/></svg>
    TrueWage
  </a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="bar-r">
    <button class="btn sm add-btn" id="btn-add" aria-label="Add screenshots"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl" data-i18n="add_shots">Add screenshots</span></button>
    <button class="ibtn" id="btn-acct" aria-label="Account"></button>
    <select id="lang" class="sel" aria-label="Language"></select>
  </div>
</header>

<main>
  <section id="view-home" class="view on"></section>
  <section id="view-insights" class="view"></section>
  <section id="view-check" class="view"></section>
  <section id="view-city" class="view"></section>
  <section id="view-proof" class="view"></section>
</main>
<div class="foot"><span id="foot-mode"></span> · TrueWage v2 · screenshots stay on your device unless you use the server AI reader</div>

<button class="fab" id="fab" hidden aria-label="Ask TrueWage"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="ask_send">Ask</span></button>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<!-- Sheet (add screenshots / costs / settings), rendered by app.js -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-t">
  <div class="sheet-in">
    <div class="sheet-h"><h2 class="h2" id="sheet-t"></h2>
      <button class="ibtn" id="sheet-x" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<input type="file" id="backup-file" accept="application/json,.json" hidden>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="js/engine.js"></script>
<script src="js/places.js"></script>
<script src="js/demo.js"></script>
<script src="js/i18n.js"></script>
<script src="js/reader.js"></script>
<script src="js/ask.js"></script>
<script src="js/app.js"></script>
</body>
</html>
